<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTO Tracker · Personal Hub</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #09080c;
    --panel: #15101b;
    --border: #45275b;
    --violet: #6f2da8;
    --lavender: #d3b8ff;
    --orange: #c83803;
    --text: #f5f2fa;
    --muted: #b8b0c3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse 46rem 26rem at 50% 0%, #271539, transparent), var(--bg);
    color: var(--text);
    font: 1rem/1.5 system-ui, sans-serif;
  }
  main { width: min(100% - 2rem, 58rem); margin: auto; padding: clamp(2rem, 6vw, 4rem) 0; }
  a { color: var(--lavender); text-underline-offset: .2em; }
  h1, h2, h3, p, dl, dd { margin: 0; }
  h1 { margin: 1rem 0 1.5rem; font-size: clamp(2.55rem, 8vw, 4.5rem); letter-spacing: -.06em; line-height: 1; }
  h2, summary { font-size: 1.15rem; font-weight: 700; }
  h3 { font-size: .98rem; }
  .muted, dt { color: var(--muted); font-size: .84rem; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: .7rem; }
  .metrics > div, .period, details, dialog { border: 1px solid var(--border); border-radius: .8rem; background: var(--panel); }
  .metrics > div { padding: .9rem 1.1rem; border-inline-start: .25rem solid var(--violet); }
  .metrics > div:first-child { border-inline-start-color: var(--orange); }
  .metrics dd { font-size: clamp(1.5rem, 5vw, 2.2rem); font-weight: 750; letter-spacing: -.045em; }
  dd { font-variant-numeric: tabular-nums; }
  section, details { margin-top: 1.5rem; }
  section > h2 { margin-bottom: .5rem; }
  .periods { display: grid; gap: .5rem; }
  .period { padding: .75rem 1rem; }
  #current .period { background: linear-gradient(110deg, #29153c, var(--panel)); border-inline-start: .25rem solid var(--violet); }
  .period-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .65rem 1rem; }
  .period-actions { display: flex; align-items: center; gap: .6rem 1rem; flex-wrap: wrap; }
  .amount { text-align: right; }
  .amount dd { color: var(--lavender); font-weight: 700; }
  .amount .negative, .negative { color: #ffad91; }
  .entries { list-style: none; padding: 0; margin: .65rem 0 0; border-top: 1px solid var(--border); }
  .entries li { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding-top: .55rem; }
  .entries li > div { overflow-wrap: anywhere; }
  .entry-label { font-weight: 650; }
  .entry-meta { color: var(--muted); font-size: .82rem; }
  .entry-meta[data-planned] { color: var(--lavender); }
  details { padding: .85rem 1rem; }
  summary { cursor: pointer; }
  details .periods { margin-top: .75rem; }
  button, select, input { font: inherit; color: inherit; }
  button, select, input {
    min-height: 2.65rem;
    border: 1px solid var(--border);
    border-radius: .45rem;
    padding: .4rem .75rem;
    background: var(--bg);
  }
  button { cursor: pointer; white-space: nowrap; }
  .period button { font-size: .85rem; }
  button.primary { background: var(--violet); border-color: var(--violet); font-weight: 700; }
  :focus-visible { outline: 2px solid var(--lavender); outline-offset: 3px; }
  dialog { width: min(100% - 2rem, 27rem); color: var(--text); padding: 1.2rem; }
  dialog::backdrop { background: #000b; }
  form { display: grid; gap: .75rem; }
  form label { display: grid; gap: .3rem; }
  .actions { display: flex; flex-wrap: wrap; justify-content: end; gap: .5rem; }
  .actions #remove { margin-inline-end: auto; }
  .footnote { margin: .75rem 0 0; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (max-width: 450px) {
    .period-actions { width: 100%; justify-content: space-between; }
    .amount { text-align: left; }
  }
.brand-heading {
  display: flex;
  align-items: center;
  gap: 1rem;
  min-width: 0;
}

.brand-mark {
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: clamp(3rem, 9vw, 4.25rem);
  aspect-ratio: 1;
  border-radius: 1rem;
  background: var(--violet);
  border-bottom: 3px solid var(--orange);
  color: var(--text);
  font-size: 1.3rem;
  font-weight: 800;
  letter-spacing: -.07em;
}

.brand-heading h1 {
  margin: 0;
  font-size: clamp(2.35rem, 6vw, 4rem);
  line-height: 1.02;
  letter-spacing: -.065em;
}

.brand-heading { margin: 1.2rem 0 1.5rem; }
</style>
<link rel="stylesheet" href="/app-theme.css">
</head>
<body class="hub-app pto-page">
<div class="swirl" aria-hidden="true"></div>
<main>
  <a href="/">← Personal Hub</a>
  <header class="brand-heading"><span class="brand-mark" aria-hidden="true">PTO</span><h1>PTO Tracker</h1></header>
  <dl class="metrics">
    <div><dt>Total available now</dt><dd id="available"></dd></div>
    <div><dt>Planned PTO</dt><dd id="planned-total"></dd><p class="muted">Current and next 26 periods</p></div>
    <div><dt>Taken PTO</dt><dd id="taken-total"></dd><p class="muted">Through the current period</p></div>
  </dl>
  <p id="notice" class="visually-hidden" role="status"></p>
  <p id="storage-error" class="negative footnote" hidden></p>
  <section aria-labelledby="current-title">
    <h2 id="current-title">Current pay period</h2>
    <div id="current"></div>
  </section>
  <section aria-labelledby="future-title">
    <h2 id="future-title">Next 26 pay periods</h2>
    <div id="future" class="periods"></div>
  </section>
  <details>
    <summary id="past-title">Past pay periods</summary>
    <div id="past" class="periods"></div>
  </details>
  <p class="muted footnote" id="rules"></p>
  <p class="muted footnote">New entries and edits are saved in this browser.</p>
</main>
<dialog id="editor" aria-labelledby="editor-title">
  <form id="form">
    <h2 id="editor-title">Add PTO</h2>
    <p id="edit-period" class="muted"></p>
    <label>Name (optional)
      <input id="name" maxlength="80" placeholder="e.g. Utah trip">
    </label>
    <label>Hours
      <input id="hours" type="number" min=".001" max="1000000" step=".001" inputmode="decimal" required>
    </label>
    <label>Status
      <select id="status"><option value="planned">Planned</option><option value="taken">Taken</option></select>
    </label>
    <p id="edit-error" class="negative" role="alert" hidden></p>
    <div class="actions">
      <button type="button" id="remove" hidden>Delete</button>
      <button type="button" id="cancel">Cancel</button>
      <button class="primary" type="submit">Save PTO</button>
    </div>
  </form>
</dialog>
<script>
  const key = 'personal-hub.pto.v1';
  const dayMs = 86400000;
  const interval = 14;
  const horizon = 26;
  const workbookData = {
    "version": 1,
    "firstAccrual": "2025-10-25",
    "openingHours": 103.04,
    "earnedHours": 4.616,
    "taken": {
      "2025-11-22": 8.0,
      "2025-12-20": 8.0,
      "2026-02-14": 64.0,
      "2026-03-28": 8.0,
      "2026-08-01": 16.0,
      "2026-10-24": 64.0
    }
  };
  const get = (id) => document.getElementById(id);
  const editor = get('editor');
  const dateFormat = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  const hourFormat = new Intl.NumberFormat('en-US', { maximumFractionDigits: 3 });
  let activeEdit;

  function day(iso) { return Date.parse(iso + 'T00:00:00Z') / dayMs; }
  function isoDay(number) { return new Date(number * dayMs).toISOString().slice(0, 10); }
  function todayNumber() {
    const now = new Date();
    return Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / dayMs;
  }
  function units(hours) { return Math.round(hours * 1000); }
  function validHours(value, min = 0) {
    return typeof value === 'number' && Number.isFinite(value) && value >= min &&
      value <= 1000000 && Math.abs(value * 1000 - units(value)) < .000001;
  }
  function validDate(date) {
    return typeof date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(date) &&
      Number.isFinite(day(date)) && isoDay(day(date)) === date;
  }
  function formatHours(value) { return hourFormat.format(value / 1000) + ' h'; }
  function periodLabel(date) {
    const end = day(date);
    return dateFormat.formatRange(new Date((end - interval + 1) * dayMs), new Date(end * dayMs));
  }

  function normalize(source) {
    if (!source || !validDate(source.firstAccrual) || !validHours(source.openingHours, -1000000) ||
        !validHours(source.earnedHours)) throw new Error('Invalid PTO settings');
    let entries;
    if (source.version === 1) {
      entries = ['taken', 'planned'].flatMap((status) =>
        Object.entries(source[status] ?? {}).filter(([, hours]) => hours !== 0)
          .map(([date, hours]) => ({ id: status + ':' + date, date, hours, status, name: '' }))
      );
    } else if (source.version === 2 && Array.isArray(source.entries)) {
      entries = source.entries;
    } else {
      throw new Error('Invalid PTO data');
    }
    const first = day(source.firstAccrual);
    const ids = new Set();
    for (const entry of entries) {
      if (!entry || typeof entry.id !== 'string' || ids.has(entry.id) || typeof entry.name !== 'string' ||
          !['taken', 'planned'].includes(entry.status) || !validHours(entry.hours, .001) ||
          !validDate(entry.date) || day(entry.date) < first || (day(entry.date) - first) % interval !== 0) {
        throw new Error('Invalid PTO entry');
      }
      ids.add(entry.id);
    }
    return { version: 2, firstAccrual: source.firstAccrual, openingHours: source.openingHours,
      earnedHours: source.earnedHours, entries };
  }

  function read() {
    const saved = localStorage.getItem(key);
    return normalize(saved === null ? workbookData : JSON.parse(saved));
  }

  function loadForDisplay() {
    try { return read(); }
    catch {
      const message = get('storage-error');
      message.textContent = 'Saved entries could not be read. The tracker is showing the original workbook data.';
      message.hidden = false;
      return normalize(workbookData);
    }
  }

  let data = loadForDisplay();

  function calculate(data, today) {
    const first = day(data.firstAccrual);
    const currentEnd = first + Math.max(0, Math.ceil((today - first) / interval)) * interval;
    const earned = units(data.earnedHours);
    const entriesByDate = new Map();
    for (const entry of data.entries) {
      const entries = entriesByDate.get(entry.date) ?? [];
      entries.push(entry);
      entriesByDate.set(entry.date, entries);
    }
    let takenTotal = 0;
    let plannedTotal = 0;
    let available = units(data.openingHours);
    let forecast = available;
    const periods = [];
    for (let end = first; end <= currentEnd + horizon * interval; end += interval) {
      const date = isoDay(end);
      const entries = entriesByDate.get(date) ?? [];
      const taken = entries.reduce((total, entry) => total + (entry.status === 'taken' ? units(entry.hours) : 0), 0);
      const planned = entries.reduce((total, entry) => total + (entry.status === 'planned' ? units(entry.hours) : 0), 0);
      if (end <= currentEnd) {
        takenTotal += taken;
        available += (end <= today ? earned : 0) - taken;
      }
      if (end >= currentEnd) plannedTotal += planned;
      forecast += earned - taken - (end >= currentEnd ? planned : 0);
      periods.push({ date, end, entries, balance: forecast });
    }
    return { currentEnd, available, plannedTotal, takenTotal, periods };
  }

  function element(tag, text, className) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function action(text, label, handler, className) {
    const button = element('button', text, className);
    button.type = 'button';
    button.setAttribute('aria-label', label);
    button.addEventListener('click', handler);
    return button;
  }

  function openEditor(period, entry) {
    activeEdit = { date: period.date, id: entry?.id };
    get('editor-title').textContent = entry ? 'Edit PTO' : 'Add PTO';
    get('edit-period').textContent = periodLabel(period.date);
    get('name').value = entry?.name ?? '';
    get('hours').value = entry?.hours ?? '';
    get('status').value = entry?.status ?? (period.end <= currentPeriod ? 'taken' : 'planned');
    get('remove').hidden = !entry;
    get('edit-error').hidden = true;
    editor.showModal();
    get('hours').focus();
  }

  function renderPeriod(period, currentEnd) {
    const card = element('article', undefined, 'period');
    const label = periodLabel(period.date);
    const heading = element('h3', label);
    const title = element('div');
    title.append(heading, element('p', 'Accrues ' + formatHours(units(data.earnedHours)), 'muted'));
    const amount = element('dl', undefined, 'amount');
    amount.append(element('dt', period.end < currentEnd ? 'Closing balance' : 'Available after planned'),
      element('dd', formatHours(period.balance), period.balance < 0 ? 'negative' : ''));
    const add = action('+ Add PTO', 'Add PTO for ' + label, () => openEditor(period), period.end === currentEnd ? 'primary' : '');
    add.dataset.period = period.date;
    const actions = element('div', undefined, 'period-actions');
    actions.append(amount, add);
    const head = element('div', undefined, 'period-head');
    head.append(title, actions);
    card.append(head);
    if (period.entries.length) {
      const list = element('ul', undefined, 'entries');
      for (const entry of period.entries) {
        const row = element('li');
        const info = element('div');
        const status = entry.status === 'taken' ? 'Taken' : 'Planned';
        const name = entry.name || 'PTO';
        const meta = element('div', status + ' · ' + formatHours(units(entry.hours)), 'entry-meta');
        if (entry.status === 'planned') meta.dataset.planned = '';
        info.append(element('div', name, 'entry-label'), meta);
        row.append(info, action('Edit', 'Edit ' + name + ', ' + status + ', ' + label, () => openEditor(period, entry)));
        list.append(row);
      }
      card.append(list);
    }
    return card;
  }

  let currentPeriod;
  function render() {
    const view = calculate(data, todayNumber());
    currentPeriod = view.currentEnd;
    for (const [id, amount] of [['available', view.available], ['planned-total', view.plannedTotal], ['taken-total', view.takenTotal]]) {
      const node = get(id);
      node.textContent = formatHours(amount);
      node.classList.toggle('negative', amount < 0);
    }
    const past = view.periods.filter(({ end }) => end < currentPeriod);
    get('current').replaceChildren(renderPeriod(view.periods[past.length], currentPeriod));
    get('future').replaceChildren(...view.periods.slice(past.length + 1).map(period => renderPeriod(period, currentPeriod)));
    get('past-title').textContent = 'Past pay periods (' + past.length + ')';
    get('past').replaceChildren(...past.reverse().map(period => renderPeriod(period, currentPeriod)));
    get('rules').textContent = 'PTO accrues at the end of each two-week period. Plans affect the running forecast from their period onward. Past plans stay in history until you edit them.';
  }

  function commit(change, message) {
    try {
      const latest = read();
      change(latest.entries);
      localStorage.setItem(key, JSON.stringify(latest));
      data = latest;
    } catch {
      const error = get('edit-error');
      error.textContent = 'Could not save this change. Check browser storage and try again.';
      error.hidden = false;
      return;
    }
    editor.close();
    get('storage-error').hidden = true;
    render();
    document.querySelector('button[data-period="' + activeEdit.date + '"]')?.focus();
    get('notice').textContent = message;
  }

  get('cancel').addEventListener('click', () => editor.close());
  get('form').addEventListener('submit', (event) => {
    event.preventDefault();
    const hours = get('hours').valueAsNumber;
    if (!validHours(hours, .001)) return;
    const entry = { id: activeEdit.id ?? crypto.randomUUID(), date: activeEdit.date, hours,
      status: get('status').value, name: get('name').value.trim() };
    commit((entries) => {
      const index = entries.findIndex(({ id }) => id === entry.id);
      if (index === -1 && activeEdit.id) throw new Error('Entry was removed');
      if (index === -1) entries.push(entry);
      else entries[index] = entry;
    }, 'PTO saved as ' + entry.status + '.');
  });
  get('remove').addEventListener('click', () => {
    if (!window.confirm('Delete this PTO entry?')) return;
    commit((entries) => {
      const index = entries.findIndex(({ id }) => id === activeEdit.id);
      if (index !== -1) entries.splice(index, 1);
    }, 'PTO entry deleted.');
  });
  window.addEventListener('storage', (event) => {
    if (event.key !== key && event.key !== null) return;
    data = loadForDisplay();
    render();
  });
  render();
</script>
</body>
</html>
