
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Project Hub</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101827;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
    }

    main {
      width: min(90%, 720px);
      padding: 48px 0;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin-bottom: 12px;
    }

    p { color: #94a3b8; line-height: 1.7; }

    .projects {
      display: grid;
      gap: 16px;
      margin-top: 32px;
    }

    .project {
      padding: 24px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: #1e293b;
    }

    .project h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }

    .project p { margin: 0; }
  </style>
</head>

<body>
  <main>
    <h1>Personal Project Hub</h1>
    <p>Applications, analytics, and development projects.</p>

    <section class="projects">
      <div class="project">
        <h2>Madden NFL Analytics</h2>
        <p>Player ratings, team comparisons, and historical trends.</p>
      </div>

      <div class="project">
        <h2>PTO Tracker</h2>
        <p>Personal time-off planning and tracking.</p>
      </div>
    </section>
  </main>
</body>
</html>
