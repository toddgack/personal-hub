<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A home for personal apps and tools.">
  <meta name="theme-color" content="#170c22">
  <title>Personal Hub</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #170c22;
      --violet: #6F2DA8;
      --orange: #C83803;
      --plum: #8b416f;
      --copper: #aa542f;
      --text: #fff8ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      position: relative;
      isolation: isolate;
      overflow-x: clip;
      background: var(--night);
      color: var(--text);
      font: 1rem/1.5 system-ui, sans-serif;
    }

    .swirl {
      position: absolute;
      z-index: -1;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 9% 17%, var(--copper) 0%, transparent 53%),
        radial-gradient(ellipse at 88% 80%, var(--violet) 0%, transparent 60%),
        #241132;
    }

    .swirl::before {
      content: "";
      position: absolute;
      inset: -22%;
      background: conic-gradient(from 32deg at 53% 55%,
        #56236f, #9c4e82 55deg, #50206d 100deg, #241132 143deg,
        #6f2da8 183deg, #a65271 220deg, #e08559 263deg,
        #913b32 300deg, #271439 331deg, #56236f);
      transform: rotate(-19deg) scaleX(1.2);
      filter: blur(clamp(2.4rem, 7vw, 7rem));
      opacity: .9;
    }

    .swirl::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 46% 28%, #1d102b 0%, #1d102b77 35%, transparent 72%),
        radial-gradient(ellipse at 95% 94%, #bd618b66 0%, transparent 47%),
        linear-gradient(160deg, #1b0c2022 20%, transparent 51%, #11091b99 100%);
    }

    main {
      width: min(100% - 2rem, 64rem);
      min-height: 100vh;
      margin-inline: auto;
      padding: clamp(3rem, 9vh, 7rem) 0 clamp(3.5rem, 12vh, 8rem);
      display: grid;
      align-content: center;
      justify-items: center;
      gap: clamp(2.5rem, 8vh, 5.5rem);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(.75rem, 3vw, 1.25rem);
    }

    h1, p { margin: 0; }

    h1 {
      font-size: clamp(2.35rem, 7vw, 4.5rem);
      line-height: 1.02;
      letter-spacing: -.065em;
      text-shadow: 0 2px 22px #1d0e2a99;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: clamp(2.9rem, 9vw, 4.25rem);
      flex: 0 0 auto;
      aspect-ratio: 1;
      border-radius: 1rem;
      border-bottom: 3px solid var(--orange);
      background: var(--violet);
      box-shadow: 0 .4rem 1.3rem #1d0e2a55;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -.07em;
    }

    nav { width: 100%; }

    .projects {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      justify-items: center;
      gap: clamp(.85rem, 3vw, 2.15rem);
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .projects li { width: min(100%, 12.5rem); }

    .project {
      display: grid;
      place-content: center;
      justify-items: center;
      gap: .45rem;
      width: 100%;
      aspect-ratio: 1;
      padding: 12%;
      border: 2px solid #fff3fbde;
      border-radius: 50%;
      background: var(--fill);
      box-shadow: 0 .8rem 2.1rem #170b285c, inset 0 1px 0 #ffffff21;
      color: var(--text);
      text-align: center;
      text-decoration: none;
    }

    .loan { --fill: linear-gradient(145deg, var(--violet), #3b1b56); }
    .holiday { --fill: linear-gradient(145deg, var(--orange), #802904); }
    .pto { --fill: linear-gradient(145deg, var(--plum), #572550); }
    .madden { --fill: linear-gradient(145deg, #694055, #352143); }

    .initials { font-size: .76rem; font-weight: 750; letter-spacing: .12em; }
    .title { font-size: clamp(1.05rem, 2vw, 1.36rem); font-weight: 750; line-height: 1.14; text-wrap: balance; }
    .arrow { line-height: 1; font-size: 1.15rem; }

    a.project:hover {
      border-color: #fff;
      box-shadow: 0 .9rem 2.4rem #160a2a9c, inset 0 0 0 3px #ffffff2b;
    }

    a.project:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 5px;
    }

    @media (max-width: 760px) {
      .projects { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 30rem; margin-inline: auto; }
    }

    @media (max-width: 490px) {
      main { gap: 2.1rem; }
      .projects { grid-template-columns: 1fr; gap: 1.1rem; }
      .projects li { width: clamp(9.75rem, 46vw, 11.5rem); }
      .title { font-size: 1.15rem; }
      .swirl::before { inset: -12% -90%; }
    }
  </style>
</head>
<body>
  <div class="swirl" aria-hidden="true"></div>
  <main>
    <header>
      <span class="brand-mark" aria-hidden="true">PH</span>
      <h1>Personal Hub</h1>
    </header>
    <nav aria-label="Projects">
      <ul class="projects">
        <li><a class="project loan" href="/parent-loan">
          <span class="initials" aria-hidden="true">PL</span>
          <span class="title">Parent Loan</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a></li>
        <li><a class="project holiday" href="/holidays">
          <span class="initials" aria-hidden="true">HC</span>
          <span class="title">Holiday Countdown</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a></li>
        <li><a class="project pto" href="/pto">
          <span class="initials" aria-hidden="true">PTO</span>
          <span class="title">PTO Tracker</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a></li>
        <li><a class="project madden" href="/madden">
          <span class="initials" aria-hidden="true">M27</span>
          <span class="title">Madden NFL 27 Analytics</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
